name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt headless runtime libraries and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            unzip
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone-unpack
          sudo install -m 0755 /tmp/rclone-unpack/rclone-*/rclone /usr/local/bin/rclone
          rm -rf /tmp/rclone.zip /tmp/rclone-unpack

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import pontis; print(pontis.__version__)')"
          echo "Tag version: $TAG_VERSION | Package version: $PKG_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"

      - name: Run quality checks and tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff format --check .
          ruff check .
          mypy
          pytest

  build-and-release:
    name: Build & Publish AppImage
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libxkbcommon0

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,packaging]"

      - name: Build AppImage
        run: PONTIS_PYTHON="$(which python)" ./packaging/linux/build_appimage.sh

      - name: Smoke-test AppImage CLI
        run: |
          APPIMAGE="$(ls -1 dist/Pontis-*-x86_64.AppImage | head -n 1)"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --help | grep -q "Pontis"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pontis-release-appimage
          path: |
            dist/Pontis-*-x86_64.AppImage
            dist/Pontis-*-x86_64.AppImage.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Pontis-*-x86_64.AppImage
            dist/Pontis-*-x86_64.AppImage.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
