name: Feature request
description: Suggest an improvement or new capability for Pontis
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What workflow or pain point are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like Pontis to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative tools/flags you currently use.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, rclone flags, or cloud provider specifics.
